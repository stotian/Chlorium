name: CPU and source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Exact atlas range reconstruction
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-tests | Out-Null
          cl /nologo /std:c++20 /EHsc /O2 /I src tests/native_atlas_regressions.cpp /Fobuild-tests/atlas.obj /Febuild-tests/atlas.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-tests/atlas.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exact native math and cache policy
        shell: pwsh
        run: |
          cl /nologo /std:c++20 /EHsc /O2 /I src tests/native_transform_math_regressions.cpp /Fobuild-tests/transform.obj /Febuild-tests/transform.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-tests/transform.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Python syntax
        run: python -m compileall -q tools
      - name: Retained renderer CPU contracts
        shell: cmd
        run: |
          cl /nologo /std:c++20 /O2 /fp:strict /EHsc research\R4-58\checks.cpp /Fobuild-tests/retained-cpu.obj /Febuild-tests/retained-cpu.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\retained-cpu.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /O2 /EHsc research\R4-60\timing_checks.cpp /Fobuild-tests/timing-cpu.obj /Febuild-tests/timing-cpu.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\timing-cpu.exe
          if errorlevel 1 exit /b %errorlevel%
      - name: Bounded group trace and arithmetic reader
        shell: cmd
        run: |
          cl /nologo /std:c++latest /O2 /fp:strict /EHsc research\R4-63\checks.cpp /Fobuild-tests/group-trace.obj /Febuild-tests/group-trace.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\group-trace.exe build-tests\owned-trace.local.bin
          if errorlevel 1 exit /b %errorlevel%
          python research/R4-63/trace_checks.py
          python research/R4-69/watch_decode_checks.py
          python research/R4-72/decode_checks.py
          python research/R4-74/decode_checks.py
          if errorlevel 1 exit /b %errorlevel%
          python research/R4-75/decode_checks.py
          if errorlevel 1 exit /b %errorlevel%
          python research/R4-30/comparison_guard_checks.py
          if errorlevel 1 exit /b %errorlevel%
      - name: Shared group-program contracts and trace compiler
        shell: cmd
        run: |
          cl /nologo /std:c++latest /O2 /fp:strict /EHsc research\R4-64\checks.cpp /Fobuild-tests/group-program.obj /Febuild-tests/group-program.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\group-program.exe
          if errorlevel 1 exit /b %errorlevel%
          python research/R4-64/compiler_checks.py
          if errorlevel 1 exit /b %errorlevel%
          python research/R4-65/comparison_checks.py
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /O2 /fp:strict /EHsc research\R4-66\checks.cpp /Fobuild-tests/page-budget.obj /Febuild-tests/page-budget.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\page-budget.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /O2 /fp:strict /EHsc research\R4-68\pure_checks.cpp /Fobuild-tests/packed-mirror.obj /Febuild-tests/packed-mirror.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\packed-mirror.exe
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++20 /O2 /fp:strict /EHsc research\R4-71\pure_checks.cpp /Fobuild-tests/mixed-program.obj /Febuild-tests/mixed-program.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\mixed-program.exe
          if errorlevel 1 exit /b %errorlevel%
          python research/R4-29/pe_ranges_checks.py
          if errorlevel 1 exit /b %errorlevel%
      - name: Owned GPU state sparse uploads
        shell: cmd
        run: |
          cl /nologo /std:c++20 /O2 /EHsc /I src tests\dirty_state_upload_checks.cpp /Fobuild-tests/snapshots.obj /Febuild-tests/snapshots.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\snapshots.exe
          if errorlevel 1 exit /b %errorlevel%
      - name: Native call bridge ABI and protection
        shell: cmd
        run: |
          cl /nologo /std:c++20 /O2 /fp:strict /EHsc /I src tests\native_call_thunk_checks.cpp /Fobuild-tests/call-thunk.obj /Febuild-tests/call-thunk.exe
          if errorlevel 1 exit /b %errorlevel%
          build-tests\call-thunk.exe
          if errorlevel 1 exit /b %errorlevel%
      - name: Heap cache release preserves live allocations
        shell: cmd
        run: |
          cl /nologo /std:c++20 /O2 /EHsc /I src tests\native_heap_release_checks.cpp /Fobuild-tests/heap-release.obj /Febuild-tests/heap-release.exe /link psapi.lib
          if errorlevel 1 exit /b %errorlevel%
          build-tests\heap-release.exe
          if errorlevel 1 exit /b %errorlevel%

